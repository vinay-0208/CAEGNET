# CAEG-Net Model Specification & Configuration
# Model: CAEG-Net (Context-Adaptive Expert Gating Network)
# Internal Variant ID: F2 / A2-OOF (ConfidenceFallbackCAEGNet)
# Certification: FINAL MODEL LOCKED — DEVELOPMENT COMPLETE

model:
  public_name: "CAEG-Net"
  internal_variant_id: "F2_A2_OOF"
  architecture_class: "ConfidenceFallbackCAEGNet"
  status: "LOCKED_FINAL_MODEL"
  lock_date: "2026-09-12"
  input_lookback_hours: 168
  forecast_horizon_hours: 24
  parameters:
    lstm_expert: 56152
    tcn_expert: 36952
    cnn_expert: 27400
    backbone_subtotal: 120504
    context_router: 1075
    confidence_head: 145
    total_parameters: 121724

experts:
  lstm:
    architecture: "Stacked Recurrent Neural Network (LSTM)"
    input_dim: 1
    hidden_dim: 64
    num_layers: 2
    dropout: 0.1
    bidirectional: false
    pooling: "last_step"
    head:
      layers:
        - "Linear(64, 64)"
        - "ReLU()"
        - "Dropout(0.1)"
        - "Linear(64, 24)"
    trainable_parameters: 56152

  tcn:
    architecture: "Dilated Causal Temporal Convolutional Network"
    input_dim: 1
    num_residual_stages: 6
    channels_per_stage: 32
    kernel_size: 3
    dilation_schedule: [1, 2, 4, 8, 16, 32]
    receptive_field_hours: 253
    block_structure:
      conv1: "Conv1d(in_c, 32, k=3, dilation=d, padding=2*d, causal_truncation)"
      norm1: "BatchNorm1d(32)"
      act1: "ReLU()"
      drop1: "Dropout(0.1)"
      conv2: "Conv1d(32, 32, k=3, dilation=d, padding=2*d, causal_truncation)"
      norm2: "BatchNorm1d(32)"
      drop2: "Dropout(0.1)"
      residual: "Conv1d(1, 32, 1) on block 1, Identity on blocks 2-6"
      act2: "ReLU(y + res)"
    pooling: "last_causal_step (features[:, :, -1])"
    head:
      layers:
        - "Linear(32, 32)"
        - "ReLU()"
        - "Dropout(0.1)"
        - "Linear(32, 24)"
    trainable_parameters: 36952

  cnn:
    architecture: "3-Stage Multi-Kernel 1D Convolutional Network"
    input_dim: 1
    conv_stack:
      stage1:
        conv: "Conv1d(1, 32, kernel_size=3, padding=1)"
        norm: "BatchNorm1d(32)"
        act: "ReLU()"
        pool: "MaxPool1d(kernel_size=2) [168 -> 84]"
      stage2:
        conv: "Conv1d(32, 64, kernel_size=5, padding=2)"
        norm: "BatchNorm1d(64)"
        act: "ReLU()"
        pool: "MaxPool1d(kernel_size=2) [84 -> 42]"
      stage3:
        conv: "Conv1d(64, 64, kernel_size=3, padding=1)"
        norm: "BatchNorm1d(64)"
        act: "ReLU()"
        pool: "AdaptiveAvgPool1d(1) [42 -> 1]"
    flatten: "squeeze(-1) [B, 64]"
    head:
      layers:
        - "Linear(64, 48)"
        - "ReLU()"
        - "Dropout(0.1)"
        - "Linear(48, 24)"
    trainable_parameters: 27400

routing:
  mechanism: "Context-Adaptive Soft Gating (Global)"
  context_dimension: 7
  latent_context_dimension: 16
  context_features:
    1: "trend (linear slope over lookback window)"
    2: "volatility (standard deviation over lookback window)"
    3: "lag-24 autocorrelation (diurnal cycle correlation)"
    4: "causal recent forecast error (trailing 24h error of preceding window)"
    5: "causal out-of-fold relative expert error (LSTM)"
    6: "causal out-of-fold relative expert error (TCN)"
    7: "causal out-of-fold relative expert error (CNN)"
  context_encoder:
    layers:
      - "Linear(7, 16)"
      - "LayerNorm(16)"
      - "ReLU()"
      - "Linear(16, 16)"
      - "ReLU()"
    trainable_parameters: 432
  gating_network:
    layers:
      - "Linear(16, 32)"
      - "ReLU()"
      - "Dropout(0.1)"
      - "Linear(32, 3)"
      - "Softmax(dim=-1)"
    trainable_parameters: 643
  total_router_parameters: 1075
  effective_expert_counts:
    pjm: 2.9931
    gefcom: 2.9765
    uci: 2.9842

confidence_fallback:
  mechanism: "Dynamic Shrinkage Blend with Equal-Expert Centroid"
  input_dimension: 7
  architecture:
    layers:
      - "Linear(7, 16)"
      - "ReLU()"
      - "Linear(16, 1)"
      - "Sigmoid()"
    trainable_parameters: 145
  formulation: "y_final = lambda * y_adaptive + (1 - lambda) * y_equal"
  equal_centroid: "y_equal = (y_LSTM + y_TCN + y_CNN) / 3.0"
  learned_lambda_statistics:
    pjm:
      mean: 0.5066
      std: 0.0038
      cv_percent: 0.75
    gefcom2014:
      mean: 0.5170
      std: 0.0055
      cv_percent: 1.06
    uci_electricity:
      mean: 0.5064
      std: 0.0030
      cv_percent: 0.59
  interpretation: "Stable empirical regularizing anchor toward the equal-expert centroid."

training:
  optimizer: "AdamW"
  loss_function: "MSE"
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 15

data_protocol:
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  split_strategy: "chronological"
  scaling: "StandardScaler fitted on train partition only"
  seeds: [42, 123, 999, 2024, 3407]

authoritative_benchmark:
  primary_metric: "MAE (in physical engineering units)"
  std_definition: "Population standard deviation (ddof=0) over 5 seeds"
  pjm:
